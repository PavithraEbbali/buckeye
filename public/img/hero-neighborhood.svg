<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" width="2000" height="1200"
     preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="A Northwest Ohio residential street at blue hour: lit windows, warm porch lights, and fiber lines running between poles">
  <defs>
    <!-- blue-hour sky: cyan horizon under deep navy, the real dusk gradient -->
    <linearGradient id="bhSky" x1="0" y1="0" x2=".16" y2="1">
      <stop offset="0"   stop-color="#000c1e"/>
      <stop offset=".26" stop-color="#01173a"/>
      <stop offset=".52" stop-color="#0a3568"/>
      <stop offset=".74" stop-color="#1a5e9c"/>
      <stop offset=".90" stop-color="#3f8cbe"/>
      <stop offset="1"   stop-color="#6fb3d4"/>
    </linearGradient>
    <radialGradient id="bhAfterglow" cx=".70" cy=".88" r=".52">
      <stop offset="0"   stop-color="#ffcfa0" stop-opacity=".62"/>
      <stop offset=".30" stop-color="#f3a26a" stop-opacity=".30"/>
      <stop offset=".68" stop-color="#c96f52" stop-opacity=".10"/>
      <stop offset="1"   stop-color="#c96f52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bhCool" cx=".14" cy=".14" r=".52">
      <stop offset="0" stop-color="#05a2f6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#05a2f6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bhRoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0b2e50"/>
      <stop offset=".35" stop-color="#05203c"/>
      <stop offset="1"   stop-color="#010f22"/>
    </linearGradient>
    <linearGradient id="bhHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fcbe8" stop-opacity="0"/>
      <stop offset="1" stop-color="#8fcbe8" stop-opacity=".26"/>
    </linearGradient>
    <radialGradient id="bhVig" cx=".5" cy=".44" r=".76">
      <stop offset=".40" stop-color="#00060f" stop-opacity="0"/>
      <stop offset=".78" stop-color="#00060f" stop-opacity=".34"/>
      <stop offset="1"   stop-color="#00060f" stop-opacity=".76"/>
    </radialGradient>

    <!-- depth of field: far plane soft, foreground softer still -->
    <filter id="bhFar"  x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="bhFore" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="22"/></filter>
    <!-- lamp bloom -->
    <filter id="bhBloom" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="bhBloomS" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="5"/></filter>
    <!-- film grain -->
    <filter id="bhGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <!-- road reflection: mirrored lights, smeared vertically -->
    <filter id="bhWet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3 14"/>
    </filter>
  </defs>

  <!-- ================= sky ================= -->
  <rect width="2000" height="1200" fill="url(#bhSky)"/>
  <rect width="2000" height="1200" fill="url(#bhCool)"/>
  <rect width="2000" height="1200" fill="url(#bhAfterglow)"/>

  <!-- thin cloud banding near the horizon -->
  <g fill="#8fb8d6" opacity=".16" filter="url(#bhFar)">
    <ellipse cx="1380" cy="512" rx="470" ry="17"/>
    <ellipse cx="700"  cy="470" rx="380" ry="12"/>
    <ellipse cx="1720" cy="440" rx="300" ry="10"/>
  </g>

  <g fill="#dbeeff">
    <circle cx="196"  cy="118" r="2.1" opacity=".50"/><circle cx="452" cy="206" r="1.5" opacity=".34"/>
    <circle cx="712"  cy="92"  r="1.8" opacity=".44"/><circle cx="1012" cy="170" r="1.4" opacity=".28"/>
    <circle cx="1320" cy="106" r="2.0" opacity=".40"/><circle cx="1596" cy="200" r="1.5" opacity=".26"/>
    <circle cx="1842" cy="134" r="1.7" opacity=".34"/>
  </g>

  <!-- ================= far treeline (soft: distance) ================= -->
  <g filter="url(#bhFar)">
    <path d="M0 700 q54-40 112-14 38-46 90-20 42-42 94-10 50-44 102-8 44-38 94-6 52-46 108-10
             42-34 90-6 48-42 100-10 46-36 96-8 50-40 102-12 44-30 92-6 52-38 106-10 42-32 88-4
             l0 480 -1704 0z"
          fill="#01152e" opacity=".9"/>
  </g>

  <!-- ================= mid ground: the street ================= -->
  <!-- houses recede left-to-right; nearer ones sit lower and larger -->
  <g fill="#021b36">
    <path d="M40 848 l164-104 164 104 0 214 -328 0z"/>
    <path d="M392 884 l134-86 134 86 0 178 -268 0z"/>
    <path d="M712 838 l176-112 176 112 0 226 -352 0z"/>
    <path d="M1092 878 l140-90 140 90 0 184 -280 0z"/>
    <path d="M1400 842 l168-108 168 108 0 222 -336 0z"/>
    <path d="M1768 886 l146-94 146 94 0 178 -292 0z"/>
  </g>
  <!-- eave shadow line gives the roofs mass -->
  <g fill="#03264a" opacity=".8">
    <rect x="40"   y="848" width="328" height="9"/>
    <rect x="392"  y="884" width="268" height="8"/>
    <rect x="712"  y="838" width="352" height="10"/>
    <rect x="1092" y="878" width="280" height="8"/>
    <rect x="1400" y="842" width="336" height="10"/>
    <rect x="1768" y="886" width="292" height="8"/>
  </g>

  <!-- ================= the warmth: lit windows ================= -->
  <g>
    <!-- bloom pass first so the crisp panes sit on top -->
    <g fill="#ffbe72" opacity=".50" filter="url(#bhBloom)">
      <rect x="120" y="904" width="44" height="54" rx="5"/><rect x="240" y="904" width="44" height="54" rx="5"/>
      <rect x="800" y="898" width="46" height="58" rx="5"/><rect x="944" y="898" width="46" height="58" rx="5"/>
      <rect x="1466" y="900" width="44" height="56" rx="5"/><rect x="1614" y="900" width="44" height="56" rx="5"/>
    </g>
    <g fill="#ffb862" opacity=".34" filter="url(#bhBloomS)">
      <rect x="452" y="932" width="36" height="44" rx="4"/><rect x="560" y="932" width="36" height="44" rx="4"/>
      <rect x="1156" y="928" width="36" height="46" rx="4"/><rect x="1272" y="928" width="36" height="46" rx="4"/>
      <rect x="1830" y="936" width="36" height="44" rx="4"/><rect x="1946" y="936" width="36" height="44" rx="4"/>
    </g>
    <!-- crisp panes, with a cooler upper sill so they read as glass -->
    <g fill="#ffd398">
      <rect x="120" y="904" width="44" height="54" rx="5"/><rect x="240" y="904" width="44" height="54" rx="5"/>
      <rect x="452" y="932" width="36" height="44" rx="4"/><rect x="560" y="932" width="36" height="44" rx="4"/>
      <rect x="800" y="898" width="46" height="58" rx="5"/><rect x="944" y="898" width="46" height="58" rx="5"/>
      <rect x="1156" y="928" width="36" height="46" rx="4"/><rect x="1272" y="928" width="36" height="46" rx="4"/>
      <rect x="1466" y="900" width="44" height="56" rx="5"/><rect x="1614" y="900" width="44" height="56" rx="5"/>
      <rect x="1830" y="936" width="36" height="44" rx="4"/><rect x="1946" y="936" width="36" height="44" rx="4"/>
    </g>
    <g fill="#fff1d6" opacity=".55">
      <rect x="120" y="904" width="44" height="13" rx="4"/><rect x="240" y="904" width="44" height="13" rx="4"/>
      <rect x="800" y="898" width="46" height="14" rx="4"/><rect x="944" y="898" width="46" height="14" rx="4"/>
      <rect x="1466" y="900" width="44" height="13" rx="4"/><rect x="1614" y="900" width="44" height="13" rx="4"/>
    </g>
    <!-- muntin bars -->
    <g stroke="#3a2410" stroke-width="2.4" opacity=".5">
      <line x1="142" y1="904" x2="142" y2="958"/><line x1="262" y1="904" x2="262" y2="958"/>
      <line x1="823" y1="898" x2="823" y2="956"/><line x1="967" y1="898" x2="967" y2="956"/>
      <line x1="1488" y1="900" x2="1488" y2="956"/><line x1="1636" y1="900" x2="1636" y2="956"/>
    </g>

    <!-- porch lamps: point sources with real falloff -->
    <g fill="#ffcf94" opacity=".30" filter="url(#bhBloom)">
      <circle cx="332" cy="980" r="26"/><circle cx="886" cy="976" r="30"/><circle cx="1548" cy="978" r="26"/>
    </g>
    <g fill="#ffe6bd">
      <circle cx="332" cy="980" r="6.5"/><circle cx="886" cy="976" r="7.5"/><circle cx="1548" cy="978" r="6.5"/>
    </g>
    <!-- porch light spill onto the ground -->
    <g fill="#ffb765" opacity=".16">
      <ellipse cx="332" cy="1042" rx="72" ry="20"/>
      <ellipse cx="886" cy="1040" rx="86" ry="24"/>
      <ellipse cx="1548" cy="1042" rx="72" ry="20"/>
    </g>
  </g>

  <!-- ================= poles + the fiber itself ================= -->
  <g stroke="#010e1f" stroke-width="10" stroke-linecap="round">
    <line x1="268" y1="1040" x2="268" y2="562"/>
    <line x1="1024" y1="1040" x2="1024" y2="528"/>
    <line x1="1786" y1="1040" x2="1786" y2="576"/>
  </g>
  <g stroke="#010e1f" stroke-width="7.5" stroke-linecap="round">
    <line x1="210" y1="604" x2="326" y2="604"/>
    <line x1="964" y1="570" x2="1084" y2="570"/>
    <line x1="1728" y1="618" x2="1844" y2="618"/>
  </g>
  <g stroke="#010e1f" stroke-width="5" stroke-linecap="round">
    <line x1="228" y1="640" x2="308" y2="640"/>
    <line x1="982" y1="606" x2="1066" y2="606"/>
    <line x1="1746" y1="654" x2="1826" y2="654"/>
  </g>
  <!-- catenary spans catching the last of the sky -->
  <g fill="none" stroke="#6fb3d4" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round">
    <path d="M268 606 q380 92 756 -36"/>
    <path d="M1024 572 q382 96 762 46"/>
  </g>
  <g fill="none" stroke="#4d8cb4" stroke-opacity=".42" stroke-width="2" stroke-linecap="round">
    <path d="M268 642 q380 104 756 -34"/>
    <path d="M1024 608 q382 104 762 48"/>
  </g>

  <!-- ================= road, with reflections ================= -->
  <path d="M0 1032 q500 -30 1000 -8 500 22 1000 -6 l0 182 -2000 0z" fill="url(#bhRoad)"/>
  <!-- mirrored warm light on damp asphalt -->
  <g opacity=".34" filter="url(#bhWet)">
    <rect x="316" y="1046" width="32" height="118" fill="#ffb765"/>
    <rect x="870" y="1044" width="36" height="132" fill="#ffc07a"/>
    <rect x="1532" y="1046" width="32" height="118" fill="#ffb765"/>
    <rect x="132"  y="1052" width="22" height="88"  fill="#ffcf94"/>
    <rect x="812"  y="1050" width="24" height="96"  fill="#ffcf94"/>
    <rect x="1478" y="1052" width="22" height="88"  fill="#ffcf94"/>
  </g>
  <!-- centre line, fading with distance -->
  <g fill="#a9bfd0" opacity=".16">
    <rect x="940" y="1074" width="66" height="5" rx="2.5"/>
    <rect x="880" y="1104" width="86" height="6" rx="3"/>
    <rect x="790" y="1146" width="112" height="7" rx="3.5"/>
  </g>

  <!-- ================= foreground framing, thrown out of focus ================= -->
  <g fill="#00080f" filter="url(#bhFore)" opacity=".96">
    <path d="M-60 1200 l0-400 q76-132 162-44 64-104 140 0 72-76 126 44 l0 400z"/>
    <path d="M1730 1200 l0-450 q86-150 180-50 76-118 160 6 80-86 140 50 l0 444z"/>
  </g>

  <!-- ================= atmosphere + lens finish ================= -->
  <rect y="600" width="2000" height="600" fill="url(#bhHaze)"/>
  <rect width="2000" height="1200" fill="url(#bhVig)"/>
  <rect width="2000" height="1200" filter="url(#bhGrain)" opacity=".07"/>
</svg>
