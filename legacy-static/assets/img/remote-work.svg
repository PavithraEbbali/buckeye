<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="kitchen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf5ff"/><stop offset="1" stop-color="#cfe8fb"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd0ff"/><stop offset="1" stop-color="#bfe6ff"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05a2f6"/><stop offset="1" stop-color="#0569d6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#kitchen)"/>

  <!-- window with panes and clouds -->
  <rect x="168" y="132" width="300" height="248" rx="14" fill="url(#window)"/>
  <g fill="#ffffff" fill-opacity=".9">
    <circle cx="248" cy="212" r="34"/><circle cx="296" cy="200" r="24"/>
  </g>
  <g stroke="#eaf5ff" stroke-width="14">
    <line x1="318" y1="132" x2="318" y2="380"/>
    <line x1="168" y1="256" x2="468" y2="256"/>
  </g>
  <rect x="168" y="132" width="300" height="248" rx="14" fill="none" stroke="#eaf5ff" stroke-width="14"/>

  <!-- plant -->
  <path d="M968 470c-46-34-58-104-30-158 44 30 62 104 30 158z" fill="#2fae5f"/>
  <path d="M968 470c34-40 34-112 2-156-36 38-38 108-2 156z" fill="#249a51"/>
  <rect x="936" y="466" width="66" height="86" rx="10" fill="#ffffff" fill-opacity=".72"/>

  <!-- person, seen from behind -->
  <circle cx="600" cy="378" r="76" fill="#0a2a4f"/>
  <path d="M462 616a138 138 0 0 1 276 0z" fill="#0a2a4f"/>
  <g fill="none" stroke="#7fd0ff" stroke-width="13" stroke-linecap="round">
    <path d="M566 566a48 48 0 0 1 68 0"/>
    <path d="M544 528a80 80 0 0 1 112 0"/>
  </g>
  <circle cx="600" cy="592" r="10" fill="#7fd0ff"/>

  <!-- laptop -->
  <path d="M508 502h184v112H508z" fill="url(#lid)"/>
  <circle cx="600" cy="596" r="9" fill="#d12229"/>
  <rect x="486" y="612" width="228" height="16" rx="8" fill="#0a2a4f"/>

  <!-- coffee -->
  <rect x="770" y="576" width="62" height="50" rx="10" fill="#ffffff"/>
  <path d="M832 588h20a16 16 0 0 1 0 32h-20z" fill="none" stroke="#ffffff" stroke-width="10"/>
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".8">
    <path d="M788 556c8-10-8-18 0-28"/><path d="M812 556c8-10-8-18 0-28"/>
  </g>

  <!-- desk -->
  <rect x="300" y="628" width="640" height="22" rx="11" fill="#0a2a4f"/>
  <rect x="336" y="650" width="20" height="216" rx="10" fill="#0a2a4f"/>
  <rect x="884" y="650" width="20" height="216" rx="10" fill="#0a2a4f"/>
</svg>
